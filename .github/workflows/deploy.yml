name: deploy

on:
  push:
    branches: [development, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" != "push" ] || [ "$RUN_ATTEMPT" != "1" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            backend=true; frontend=true
          else
            backend=false; frontend=false
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- backend deploy .github/workflows || backend=true
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- frontend .github/workflows || frontend=true
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/checks.yml

  publish-image:
    if: >
      vars.DEPLOY_ENABLED == 'true' &&
      needs.changes.outputs.backend == 'true' &&
      (github.ref_name == 'development' || github.ref_name == 'production')
    needs: [changes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t "ghcr.io/raiyanbhuiyan/vpc-backend:${GITHUB_SHA}" backend
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/raiyanbhuiyan/vpc-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push
        run: docker push "ghcr.io/raiyanbhuiyan/vpc-backend:${GITHUB_SHA}"
      - id: digest
        run: |
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/raiyanbhuiyan/vpc-backend:${GITHUB_SHA}")"
          digest="${ref#*@}"
          echo "$digest" | grep -E '^sha256:[a-f0-9]{64}$'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy-backend:
    if: needs.publish-image.result == 'success'
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    steps:
      - name: SSH deploy
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          hosts="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > "$hosts"
          chmod 600 "$key" "$hosts"
          ssh -i "$key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=15 \
            "deploy@$DROPLET_HOST" "$DIGEST"

  deploy-frontend:
    if: >
      always() &&
      !cancelled() &&
      vars.DEPLOY_ENABLED == 'true' &&
      needs.checks.result == 'success' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    needs: [changes, checks, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g vercel@66.6.0
      - name: Pull / build / deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "production" ]; then
            vercel pull --yes --environment=production
            vercel build --prod
            url="$(vercel deploy --prebuilt --prod)"
          else
            vercel pull --yes --environment=preview
            vercel build
            url="$(vercel deploy --prebuilt)"
            vercel alias set "$url" "${{ vars.STAGING_FRONTEND_URL }}"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$URL")"
          test "$code" = "200"